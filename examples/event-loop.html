    const px = TL.W / TL.SEC, bw = 32.4 * px * jam, dw = 1.1 * px * rel;
    k.bar('blocked', TL.X, TL.Y, Math.max(8, Math.round(bw)), 40, { color: 'red' });
    if (rel > 0) k.bar('done', Math.round(TL.X + 32.4 * px) + 12, TL.Y, Math.max(4, Math.round(dw)), 40, { color: 'teal' });
    k.ticks(TL.X, TL.Y + 40, { length: TL.W, n: 67, len: 6, major: 10, majorLen: 14, alpha: 0.6 });
    if (bw > 360) k.dim('dimB', TL.X, TL.Y - 20, TL.X + bw, TL.Y - 20, { label: `${(32.4 * jam).toFixed(1)} s blocked`, color: 'red', p: 1 });
    if (t >= 0.9) k.text('done2', TL.X + TL.W, TL.Y + 64, 'all 21 done in under 1.1 s', { size: 40, weight: 700, color: 'tealDeep', align: 'right' });
  },
});

// 2 · mechanism: every record re-parsed every earlier record
const N = 12, PAIRS = 66, TX = 300, TY = 236, TPX = 46, TPY = 44;
scene({
  title: 'Cause: quadratic re-parsing',
  caption: "each record's text parsed once; comparison texts normalized once",
  plate: 'blueprint',
  duration: 3,
  draw(k, t) {
    const done = Math.floor(k.twos(k.seg(t, 0, 0.8)) * PAIRS), after = Math.min(N, done);
    k.guide(540, 476, 330, { alpha: 0.14, dash: [3, 8] });
    k.guide(1600, 520, 240, { alpha: 0.14 });
    k.text('hb', 96, 160, 'before: re-parse every earlier record', { size: 44, weight: 600, color: 'schemHero' });
    k.text('ha', 1060, 160, 'after: parse once', { size: 44, weight: 600, color: 'schemOk' });
    let head = null;
    for (let i = 0; i < N; i++) {
      const y = TY + i * TPY;
      for (let j = 0; j < i; j++) {
        const g = i * (i - 1) / 2 + j, x = TX + j * TPX, cell = k.rectPts(x, y, 38, 36), on = g < done;
        if (on) { polyFill(k, [cell], 'schemHero', done - g < 6 ? 0.75 : 0.35); if (g === done - 1 && done < PAIRS) head = [x + 19, y + 18]; }
        k.stroke(cell, { closed: true, width: 1.4, color: on ? 'schemHero' : 'lavender', alpha: on ? 0.9 : 0.3 });
      }
      const cy = TY + i * TPY, cell = k.rectPts(1080, cy, 38, 36);
      if (i < after) polyFill(k, [cell], 'schemOk', i === after - 1 && after < N ? 0.8 : 0.4);
      k.stroke(cell, { closed: true, width: 1.4, color: i < after ? 'schemOk' : 'lavender', alpha: i < after ? 0.95 : 0.3 });
    }
    if (head) k.glowDot(head[0], head[1], 8, { color: 'schemHero', rays: 8 });
    if (after < N && done > 0) k.glowDot(1099, TY + (after - 1) * TPY + 18, 8, { color: 'schemOk' });
    k.dim('rows', 272, TY, 272, TY + N * TPY - 8, { label: 'N = 12', side: 'left' });
    k.dim('cols', TX, TY + N * TPY + 16, TX + 11 * TPX - 8, TY + N * TPY + 16, { label: 'N − 1 = 11 earlier', side: 'below' });
    k.ticks(TX, TY + N * TPY + 4, { length: 11 * TPX - 8, n: 11, len: 8, major: 1, majorLen: 12, side: 1, alpha: 0.5 });
    k.text('nb', 784, 236, `${done}`, { size: 128, weight: 700, color: 'schemHero', align: 'right' });
    k.text('nb2', 784, 380, 'parses', { size: 40, color: 'lavender', align: 'right' });
    k.region('col', 1072, TY - 8, 54, N * TPY + 8);
    k.text('fb', TX + 5 * TPX + 15, 876, 'N(N−1)/2', { size: 64, weight: 700, color: 'schemHero', align: 'center' });
    k.text('fa', 1099, 876, 'N', { size: 64, weight: 700, color: 'schemOk', align: 'center' });
    k.text('na', 1160, 236, `${after}`, { size: 128, weight: 700, color: 'schemOk' });
    k.text('na2', 1160, 380, 'parses', { size: 40, color: 'lavender' });

    k.disc('cache', 1600, 520, 116, { fill: 'navyLight' });
    k.hexLattice(k.ellipse(1600, 520, 100, 100, 72), { r: 16, color: 'schemOk', alpha: 0.35 + 0.3 * (after / N), clip: true });
    k.glowDot(1600, 520, 10, { color: 'schemOk', rays: 12, intensity: 0.4 + 0.6 * (after / N) });
    for (const [nx, ny, an] of [[1820, 380, 0], [1826, 660, 1], [1400, 330, 2]]) {
      k.stroke([[1600 + (nx - 1600) * 0.5, 520 + (ny - 520) * 0.5], [nx, ny]], { width: 1.2, alpha: 0.4 });
      k.disc(`node${an}`, nx, ny, 30, { fill: 'navyDeep', width: 1.6 });
      if (an === 0) k.hexLattice(k.ellipse(nx, ny, 22, 22, 36), { r: 7, clip: true, alpha: 0.5 });
      else if (an === 1) for (let l = -2; l <= 2; l++) k.stroke([[nx - 18, ny + l * 8], [nx + 18, ny + l * 8]], { width: 1.2, alpha: 0.6 });
      else k.glowDot(nx, ny, 5, { rays: 6 });
    }
    k.arrow('col', 'cache', { bend: 50, color: 'schemOk', p: k.seg(t, 0.1, 0.5) });
    k.text('cacheL', 1600, 664, 'earlierTexts', { size: 44, weight: 600, align: 'center', color: 'schemOk' });
    k.text('cache2', 1600, 720, 'parsed once, reused', { size: 40, color: 'lavender', align: 'center' });
  },
});

// 3 · mechanism: the band skips cells that cannot matter
const M = 480, LX = 224, RX = 880, MY = 232, B = 24, LENS3 = { x: 1640, y: 472, r: 200, mag: 5 };
const bandPoly = [[RX, MY], [RX + B, MY], [RX + M, MY + M - B], [RX + M, MY + M], [RX + M - B, MY + M], [RX, MY + B]];
const drawMatrix = (k, x0, rows, band) => {
  const clipTo = (h, fn) => { const c = k.ctx; c.save(); c.beginPath(); c.rect(x0, MY, M, h); c.clip(); fn(); c.restore(); };
  const grid = new Path2D();
  for (let g = 8; g < M; g += 8) { grid.moveTo(x0 + g, MY); grid.lineTo(x0 + g, MY + M); grid.moveTo(x0, MY + g); grid.lineTo(x0 + M, MY + g); }
  k.ctx.save(); k.ctx.strokeStyle = k.pal.lavender; k.ctx.globalAlpha = 0.12; k.ctx.lineWidth = 0.6; k.ctx.stroke(grid); k.ctx.restore();
  if (band) {
    const outside = [k.rectPts(x0, MY, M, M), bandPoly];
    k.stipple(outside, { spacing: 9, r: [0.8, 1.6], color: 'lavender', alpha: 0.45, seed: 3 });
    clipTo(rows, () => { polyFill(k, [bandPoly], 'schemOk', 0.35); k.hatch(bandPoly, { spacing: 5, width: 1, color: 'schemOk', alpha: 0.8, clip: true, seed: 4 }); });
    k.stroke(bandPoly, { closed: true, width: 2, color: 'schemOk', alpha: 0.9 });
  } else clipTo(rows, () => { polyFill(k, [k.rectPts(x0, MY, M, M)], 'schemHero', 0.3); k.hatch(k.rectPts(x0, MY, M, M), { spacing: 6, width: 1, color: 'schemHero', alpha: 0.75, clip: true, seed: 5 }); });
  k.stroke([[x0, MY], [x0 + M, MY + M]], { width: 1.5, dash: [8, 8], color: 'lineWhite', alpha: 0.6 });
};
scene({
  title: 'Fix: banded Levenshtein',
  caption: '0.99 threshold ⇒ distance ≤ 1% of length, so the band is exact',
  plate: 'blueprint',
  duration: 3,
  draw(k, t) {
    const f = k.twos(k.seg(t, 0, 0.8)), rows = Math.round(f * M);
    k.text('sub', 960, 152, 'skip every cell more than k off the diagonal', { size: 44, weight: 600, align: 'center' });
    k.box('full', LX, MY, M, M, { radius: 4, fill: 'navyDeep', color: 'schemHero' });
    k.box('band', RX, MY, M, M, { radius: 4, fill: 'navyDeep', color: 'schemOk' });
    drawMatrix(k, LX, rows, false);
    drawMatrix(k, RX, rows, true);
    if (f < 1) {
      k.stroke([[LX, MY + rows], [LX + M, MY + rows]], { width: 3, color: 'lineWhite' });
      k.glowDot(LX + M, MY + rows, 8, { color: 'schemHero' });
      const c0 = Math.max(0, rows - B), c1 = Math.min(M, rows + B);
      k.stroke([[RX + c0, MY + rows], [RX + c1, MY + rows]], { width: 3, color: 'lineWhite' });
      k.glowDot(RX + c1, MY + rows, 8, { color: 'schemOk' });
    }
    k.text('inf1', RX + 330, MY + 90, 'INF', { size: 40, weight: 600, color: 'lavender', parent: 'band' });
    k.text('inf2', RX + 70, MY + 350, 'INF', { size: 40, weight: 600, color: 'lavender', parent: 'band' });
    k.dim('side', 200, MY, 200, MY + M, { label: '5,000', side: 'left' });
    const sx = RX + 160, sy = MY + 160;
    k.lens('zoom', LENS3.x, LENS3.y, LENS3.r, { target: [sx, sy], targetR: 40, source: [sx, sy], mag: LENS3.mag, color: 'schemOk', draw: k2 => drawMatrix(k2, RX, rows, true) });
    const lx = LENS3.x, ly = LENS3.y;
    k.dim('kdim', lx + 40, ly + 40, lx + 40, ly - 80, { color: 'lineWhite' });
    k.text('kk', lx + 20, ly - 38, 'k ≈ 50', { size: 36, weight: 700, align: 'right', parent: 'zoom' });
    k.text('linf1', lx + 95, ly - 123, 'INF', { size: 36, weight: 600, color: 'lavender', align: 'center', parent: 'zoom' });
    k.text('linf2', lx - 95, ly + 87, 'INF', { size: 36, weight: 600, color: 'lavender', align: 'center', parent: 'zoom' });
    k.text('lf', LX + M / 2, 736, 'full DP, 5,000 × 5,000', { size: 40, color: 'lavender', align: 'center' });
    k.text('cf', LX + M / 2, 792, `${(25 * f).toFixed(1)}M cells`, { size: 88, weight: 700, color: 'schemHero', align: 'center' });
    k.text('lb', RX + M / 2, 736, 'band k ≈ 50 (drawn wide)', { size: 40, color: 'lavender', align: 'center' });
    k.text('cb', RX + M / 2, 792, `${Math.round(250 * f)}k cells`, { size: 88, weight: 700, color: 'schemOk', align: 'center' });
  },
});

// 4 · story: the result
const RES = [['11 records · verbatim', 587, '587 ms', 6, '6 ms'], ['11 · 300 words rewritten', 2100, '2.1 s', 9, '9 ms'], ['11 · 500 words rewritten', 6100, '6.1 s', 15, '15 ms'], ['25 · rewritten', 15900, '15.9 s', 25, '25 ms'], ['37 · rewritten', 56000, '56.0 s', 54, '54 ms']];
scene({
  title: 'Result: 56 s → 54 ms',
  caption: 'sqrt scale · real function on synthetic record lists · byte-identical output',
  plate: 'paper',
  band: 'stripeSage',
  draw(k) {
    const X0 = 640, SPAN = 760, w = ms => Math.max(10, Math.round(Math.sqrt(ms) * SPAN / Math.sqrt(56000)));
    k.construct(1640, 270, 200, { rings: [1, 1.35], reach: 1.7, rays: 12 });
    for (const [s, lab] of [[0, '0'], [1000, '1 s'], [10000, '10 s'], [30000, '30 s'], [56000, '56 s']]) {
      const x = X0 + Math.round(Math.sqrt(s) * SPAN / Math.sqrt(56000));
      k.stroke([[x, 160], [x, 900]], { width: 1.2, color: 'inkFaint', alpha: 0.45, dash: [4, 8] });
      k.text(`ax${s}`, x, 916, lab, { size: 32, color: 'inkSoft', align: 'center' });
    }
    k.ticks(X0, 900, { length: SPAN, n: 76, len: 6, major: 19, majorLen: 12, side: -1, alpha: 0.6 });
    RES.forEach(([label, b, bl, a, al], i) => {
      const y = 168 + i * 148;
      k.text(`r${i}`, 604, y + 38, label, { size: 40, weight: 600, align: 'right' });
      k.bar(`bb${i}`, X0, y, w(b), 52, { color: 'orange' });
      k.text(`vb${i}`, X0 + w(b) + 20, y + 6, bl, { size: 40, weight: 600, color: 'ink' });
      k.bar(`ba${i}`, X0, y + 64, w(a), 52, { color: 'teal' });
      k.text(`va${i}`, X0 + w(a) + 20, y + 70, al, { size: 40, weight: 700, color: 'tealDeep' });
    });
    k.ink([[1410, 812], [1330, 856], [1100, 862], [830, 858]], { width: 4, color: 'annMagenta', arrow: 24 });
    k.text('hero', 1640, 206, '~1000×', { size: 128, weight: 700, color: 'tealDeep', align: 'center' });
    k.ring(1640, 272, 250, { ry: 118, width: 3.5 });
    k.text('hero2', 1640, 406, 'faster at 37 records', { size: 40, color: 'inkSoft', align: 'center' });
    k.bar('lgbS', 1500, 512, 40, 32, { color: 'orange' }); k.text('lgb', 1560, 508, 'before', { size: 40, color: 'inkSoft' });
    k.bar('lgaS', 1500, 572, 40, 32, { color: 'teal' }); k.text('lga', 1560, 568, 'after', { size: 40, color: 'inkSoft' });
  },
});

// ---- viewer + capture API ----
const ready = Promise.allSettled([document.fonts.load(FONT(40, 400)), document.fonts.load(FONT(40, 600)), document.fonts.load(FONT(64, 700))]);
let cur = Math.min(scenes.length - 1, +new URLSearchParams(location.search).get('scene') || 0), manual = false;
let at = 0, target = 0, last = performance.now();
const hud = document.getElementById('hud');
const fit = () => {
  const dpr = devicePixelRatio, room = Math.min((innerWidth - 32) * dpr / W, innerHeight * dpr / H), n = room >= 1 ? Math.floor(room) : room;
  out.style.width = `${W * n / dpr}px`; out.style.height = `${H * n / dpr}px`;
};
addEventListener('resize', fit);
fit();
const stops = sc => [...(sc.steps || []), 1];
let shown = '';
function tick(now) {
  if (manual) return;
  const sc = scenes[cur];
  if (sc.duration) at = Math.min(target, at + (now - last) / 1000 / sc.duration);
  last = now;
  const tt = sc.duration ? at : sc.poster, key = `${cur}:${Math.floor(tt * (sc.duration || 0) * sc.fps)}`;
  if (key !== shown) { render(cur, tt); shown = key; }
  const s = stops(sc), step = s.filter(x => x <= at).length;
  hud.textContent = `${cur + 1}/${scenes.length}` + (sc.duration && s.length > 1 ? ` · ${step}/${s.length}` : '') + (sc.duration && at >= 1 ? ' · space replays' : '');
  requestAnimationFrame(tick);
}
const play = () => { at = 0; target = stops(scenes[cur])[0]; shown = ''; };
const slide = d => { cur = (cur + d + scenes.length) % scenes.length; play(); };
const step = d => {
  const sc = scenes[cur];
  if (!sc.duration) return slide(d);
  const s = stops(sc);
  if (d > 0) { if (at >= 1) play(); else if (at >= target) target = s.find(x => x > at); }
  else at = target = [0, ...s].filter(x => x < at).pop() ?? 0;
};
out.addEventListener('click', e => e.shiftKey ? step(-1) : at >= 1 ? slide(1) : step(1));
addEventListener('keydown', e => {
  const act = { ArrowDown: () => slide(1), PageDown: () => slide(1), ArrowUp: () => slide(-1), PageUp: () => slide(-1), ArrowRight: () => step(1), ArrowLeft: () => step(-1), ' ': play }[e.key];
  if (act) { e.preventDefault(); act(); }
});
play();
window.pixelviz = {
  ready,
  count: () => scenes.length,
  info: i => ({ title: scenes[i].title, duration: scenes[i].duration, poster: scenes[i].poster, fps: scenes[i].fps, plate: scenes[i].plate, steps: stops(scenes[i]) }),
  frame(i, t) { manual = true; render(i, t); return out.toDataURL('image/png'); },
  lint(i, t) { manual = true; return lint(i, t); },
};
ready.then(() => requestAnimationFrame(tick));
</script>
